spring.application.name=PlatformProfileService
spring.datasource.url=jdbc:mysql://localhost:3306/car_space
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driverClassName=com.mysql.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
platform.auth.service.base.url=http://localhost:8092/api/v1
platform.auth.service.base.prod.url=https://carserviceplatform-api.com
server.port=8092
server.servlet.contextPath=/api/v1
notification.service.send.email.url=http://localhost:8093/api/v1/notification/send
authentication.encrypt.secret=Platform$123
platform.auth.service.email.confirm.url=http://localhost:8091/api/v1/auth/email/confirm


eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.client.register-with-eureka= true
eureka.client.fetch-registry= true

eureka.instance.prefer-ip-address: true
eureka.instance.ip-address: 192.168.1.14
eureka.instance.lease-renewal-interval-in-seconds: 10
eureka.instance.lease-expiration-duration-in-seconds: 20