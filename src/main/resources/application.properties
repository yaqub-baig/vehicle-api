spring.application.name=vehicle-api
spring.profiles.active=local
spring.datasource.url=jdbc:mysql://localhost:3306/auto_adda_vehicle
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
auth.service.base.url=http://localhost:8030/api/v1
auth.service.base.prod.url=https://vehicle.mylstech.xyz/api/v1
server.port=8030

file.upload-dir=../uploaded-files
file.base-url=http://192.168.1.14:8092/vehicle-service/api/v1
server.servlet.contextPath=/api/v1
notification.service.send.email.url=http://localhost:8093/api/v1/notification/send
authentication.encrypt.secret=Platform$123
auth.service.email.confirm.url=http://localhost:8091/api/v1/auth/email/confirm

springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tryItOutEnabled=true

eureka.client.service-url.defaultZone= http://localhost:8761/eureka/
eureka.client.register-with-eureka= false
eureka.client.fetch-registry= false

eureka.instance.prefer-ip-address: true
eureka.instance.ip-address: 192.168.1.14
eureka.instance.lease-renewal-interval-in-seconds: 10
eureka.instance.lease-expiration-duration-in-seconds: 20

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=70MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Tomcat Configuration
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.connection-timeout=60000
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# HikariCP pool settings (Spring Boot default)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE
logging.level.org.springframework.web.servlet=DEBUG

# Vehicle borrowing - return approval reminder sweep interval (ms), default 30 minutes
vehicle.borrowing.return-reminder.interval-ms=1800000

# Gemini (document text extraction). Set GEMINI_API_KEY in the environment, never commit the key.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:90}
# 0 turns off Gemini "thinking", which is slow and not needed to read printed text
gemini.thinking-budget=${GEMINI_THINKING_BUDGET:0}
