# Production Profile Configuration
spring.application.name=vehicle-api

# Database Configuration (will be overridden by environment variables in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/auto_adda_vehicle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Server Configuration
server.port=${SERVER_PORT:8030}
server.servlet.context-path=/api/v1

# File Upload Configuration
file.upload-dir=${FILE_UPLOAD_DIR:/app/documents}
file.base-url=${FILE_BASE_URL:https://vehicle.autoadda.mylstech.com/api/v1}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Service URLs (Production)
vehicle.service.base.url=${VEHICLE_SERVICE_BASE_URL:https://api.autoadda.mylstech.com/vehicle}
vehicle.service.base.prod.url=${VEHICLE_SERVICE_BASE_PROD_URL:https://api.autoadda.mylstech.com}
notification.service.send.email.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8093/api/v1/notification/send}
platform.auth.service.email.confirm.url=${AUTH_SERVICE_EMAIL_CONFIRM_URL:http://identity-service:8010/api/v1/auth/email/confirm}

# Security Configuration
authentication.encrypt.secret=${AUTHENTICATION_ENCRYPT_SECRET:Platform$123}
spring.security.enabled=false
security.basic.enabled=false

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.tryItOutEnabled=true
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Eureka Configuration (disabled for now - can enable later for service discovery)
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

# Actuator Configuration (for health checks)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.autoadda.apis.vehicle=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/app/logs/vehicle-service.log
logging.file.max-size=10MB
logging.file.max-history=30

# Vehicle borrowing - return approval reminder sweep interval (ms), default 30 minutes
vehicle.borrowing.return-reminder.interval-ms=${VEHICLE_BORROWING_RETURN_REMINDER_INTERVAL_MS:1800000}

# Tomcat Configuration
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.connection-timeout=60000
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
